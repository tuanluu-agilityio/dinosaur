<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atmosphere dev page</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f0c; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #dev-overlay { position: fixed; top: 8px; left: 8px; padding: 4px 8px; font: 12px monospace; color: #cfe; background: rgba(0,0,0,.6); }
      #dev-overlay button { margin-left: 4px; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="dev-overlay" hidden><span id="label"></span>
      <button data-tier="high">high</button><button data-tier="medium">medium</button><button data-tier="low">low</button></div>
    <!--
      P3-T02 dev page. Params: tier=low|medium|high, webgl=1 (force the WebGL2 backend),
      particles=N, godrays=0|1, shadows=0|1, fog=0 (overrides for perf layering), trunks=0 + dino=0 (empty scene),
      angle=<rad> + still=1 (fixed camera for screenshots). The camera orbits a T. rex stand-in
      (public/models/tyrannosaurus.high.glb) at close-up distance so its readability can be judged.
      window.__atmo: stats(), setTier(t), computeCalls(), begin()/end() frame-time recording (same method as perf.spec.ts).
    -->
    <script type="module">
      import {
        Scene, PerspectiveCamera, Mesh, PlaneGeometry, CylinderGeometry, SphereGeometry, InstancedMesh,
        MeshStandardNodeMaterial, Object3D, WebGPURenderer, ACESFilmicToneMapping, AnimationMixer, Box3, Vector3,
      } from 'three/webgpu';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
      import { createRenderer } from '/src/core/renderer.ts';
      import { Atmosphere } from '/src/world/atmosphere.ts';
      import { groundContactAO } from '/src/world/lighting.ts';

      const q = new URLSearchParams(location.search);
      const t = q.get('tier');
      const tier = t === 'low' || t === 'medium' || t === 'high' ? t : 'high';
      const num = (k) => (q.has(k) && Number.isFinite(Number(q.get(k))) ? Math.max(0, Math.floor(Number(q.get(k)))) : undefined);
      const flag = (k) => (q.has(k) ? q.get(k) !== '0' : undefined);

      const canvas = document.getElementById('scene');
      let renderer, isWebGPU;
      if (q.get('webgl') === '1') {
        renderer = new WebGPURenderer({ canvas, antialias: true, forceWebGL: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        await renderer.init();
        isWebGPU = false;
      } else {
        ({ renderer, isWebGPU } = await createRenderer(canvas));
      }
      renderer.toneMapping = ACESFilmicToneMapping;

      let adapter = 'unknown';
      try {
        const info = (await navigator.gpu?.requestAdapter())?.info;
        if (info) adapter = [info.vendor, info.architecture, info.device, info.description].filter(Boolean).join(' / ') || 'unknown';
      } catch { /* diagnostic only */ }

      const scene = new Scene();
      const camera = new PerspectiveCamera(50, 1, 0.1, 250);

      const atmo = new Atmosphere(scene, renderer, {
        tier, isWebGPU,
        overrides: { particles: num('particles'), godrays: flag('godrays'), shadows: flag('shadows'), fog: flag('fog') },
      });

      // Stand-in forest: leaf-litter ground, conifer-like trunks and a broken canopy layer.
      if (q.get('trunks') !== '0') {
        const ground = new Mesh(new PlaneGeometry(500, 500), new MeshStandardNodeMaterial({ color: 0x3a2f20, roughness: 1 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
        const N = 90, dummy = new Object3D();
        // 20 radial segments: with 8, the sun-lit face of each trunk showed as a hard bright strip at grazing angles.
        const trunkMat = new MeshStandardNodeMaterial({ color: 0x4a3a2a, roughness: 0.95 });
        trunkMat.aoNode = groundContactAO;
        const trunks = new InstancedMesh(new CylinderGeometry(0.35, 0.6, 1, 20), trunkMat, N);
        const crowns = new InstancedMesh(new SphereGeometry(1, 12, 8), new MeshStandardNodeMaterial({ color: 0x2c4a22, roughness: 0.9 }), N);
        for (let i = 0; i < N; i++) {
          // 20 m glade: no trunk between the orbiting camera (15 m) and the stand-in.
          const r = 20 + rnd(i) * 70, a = rnd(i + 0.5) * Math.PI * 2, h = 14 + rnd(i + 0.25) * 10;
          dummy.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r); dummy.scale.set(1, h, 1); dummy.rotation.set(0, 0, 0);
          dummy.updateMatrix(); trunks.setMatrixAt(i, dummy.matrix);
          atmo.contactShadows.add(dummy.position.x, 0, dummy.position.z, 1.3);
          dummy.position.y = h + 1; dummy.scale.set(4 + rnd(i + 0.7) * 3, 2.2, 4 + rnd(i + 0.9) * 3);
          dummy.updateMatrix(); crowns.setMatrixAt(i, dummy.matrix);
        }
        for (const m of [trunks, crowns]) { m.castShadow = true; m.receiveShadow = true; scene.add(m); }
      }

      // Dinosaur stand-in: the merged T. rex GLB, ~12 m long, at the orbit centre. Its contact shadow follows it.
      let mixer = null, dino = null;
      if (q.get('dino') !== '0') {
        const ktx2 = new KTX2Loader().setTranscoderPath(`${import.meta.env.BASE_URL}node_modules/three/examples/jsm/libs/basis/`);
        ktx2.detectSupport(renderer);
        const loader = new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);
        try {
          const gltf = await loader.loadAsync(`${import.meta.env.BASE_URL}models/tyrannosaurus.high.glb`);
          dino = gltf.scene;
          const size = new Box3().setFromObject(dino).getSize(new Vector3());
          dino.scale.setScalar(12 / Math.max(size.x, size.z));
          const box = new Box3().setFromObject(dino);
          dino.position.y -= box.min.y;
          dino.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
          scene.add(dino);
          const len = Math.max(box.max.x - box.min.x, box.max.z - box.min.z);
          const alongX = box.max.x - box.min.x >= box.max.z - box.min.z;
          atmo.contactShadows.add(0, 0, 0, len * 0.18, 3, alongX ? 0 : Math.PI / 2);
          if (gltf.animations[0]) { mixer = new AnimationMixer(dino); mixer.clipAction(gltf.animations[0]).play(); }
        } catch (e) {
          console.warn('atmosphere dev: T. rex stand-in not loaded', e);
        } finally {
          ktx2.dispose();
        }
      }

      const resize = () => {
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      };
      window.addEventListener('resize', resize);
      resize();

      const label = document.getElementById('label');
      const overlay = document.getElementById('dev-overlay');
      overlay.hidden = false;
      const showLabel = () => {
        const s = atmo.stats();
        label.textContent = `tier: ${s.tier} | particles ${s.particlesDrawn} | godrays ${s.godrays ? 'on' : 'off'} | shadows ${s.shadows ? 'on' : 'off'} | fog ${s.fog ? 'on' : 'off'} | ${isWebGPU ? 'webgpu' : 'webgl2'}`;
      };
      const setTier = (tier) => { atmo.setTier(tier); showLabel(); };
      for (const b of overlay.querySelectorAll('button')) b.addEventListener('click', () => setTier(b.dataset.tier));
      showLabel();

      // Frame times in a preallocated buffer (no allocation in the loop), as in src/spike/spike.ts.
      const frames = new Float64Array(32768);
      let count = 0, recording = false, elapsed = 0, lastNow = performance.now();
      const still = q.get('still') === '1';
      // Orbit the stand-in at close-up distance; angle 3.75 looks into the sun, 2.75 is oblique.
      const angle0 = Number(q.get('angle') ?? 3.75);
      const place = (a) => { camera.position.set(Math.cos(a) * 15, 2.4, Math.sin(a) * 15); camera.lookAt(0, 2.6, 0); };
      place(angle0);
      atmo.update(camera, 0);
      await renderer.compileAsync(scene, camera);

      const api = {
        ready: true, frame: 0, backend: isWebGPU ? 'webgpu' : 'webgl2', adapter,
        stats: () => atmo.stats(), setTier,
        computeCalls: () => renderer.info.compute.calls,
        begin() { count = 0; lastNow = performance.now(); recording = true; },
        end() { recording = false; return Array.from(frames.subarray(0, count)); },
      };
      // Own loop instead of startLoop(): startLoop only knows renderers made by createRenderer (not webgl=1).
      let last = performance.now();
      renderer.setAnimationLoop(() => {
        const now = performance.now();
        const dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        if (recording && count < frames.length) frames[count++] = now - lastNow;
        lastNow = now;
        elapsed += dt;
        // Slow orbit that turns the view towards and away from the sun.
        if (!still) place(angle0 + elapsed * 0.08);
        mixer?.update(dt);
        atmo.update(camera, dt);
        renderer.render(scene, camera);
        api.frame++;
      });
      window.__atmo = api;
      document.documentElement.dataset.ready = '1';
    </script>
  </body>
</html>
